name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The macOS runner is arm64, so npm only installs the arm64 native binaries.
      # Add the x64 ones too so the universal build works on Intel Macs.
      - name: Install x64 native binaries
        if: runner.os == 'macOS'
        run: |
          LLAMA=$(node -p "require('./node_modules/node-llama-cpp/package.json').optionalDependencies['@node-llama-cpp/mac-x64']")
          REFLINK=$(node -p "require('./node_modules/@reflink/reflink/package.json').optionalDependencies['@reflink/reflink-darwin-x64']")
          npm install --no-save --force "@node-llama-cpp/mac-x64@$LLAMA" "@reflink/reflink-darwin-x64@$REFLINK"

      - run: npm run build

      # Tag (v1.2.3): build and attach the installers to a draft GitHub release
      - name: Build and publish
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'macOS'
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # macOS: signed with the Developer ID certificate and notarized by Apple
      - name: Build, sign, notarize and publish (macOS)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Manual run: build only, download from the run's artifacts
      - name: Build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: agenoras-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*-mac.zip
          if-no-files-found: ignore
