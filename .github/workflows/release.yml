name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The macOS runner is arm64, so npm only installs the arm64 llama binaries.
      # Add the x64 ones too so the universal build works on Intel Macs.
      - name: Install x64 llama binaries
        if: runner.os == 'macOS'
        run: |
          VER=$(node -p "require('./node_modules/node-llama-cpp/package.json').optionalDependencies['@node-llama-cpp/mac-x64']")
          npm install --no-save --force "@node-llama-cpp/mac-x64@$VER"

      - run: npm run build

      # Tag (v1.2.3): build and attach the installers to a draft GitHub release
      - name: Build and publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Manual run: build only, download from the run's artifacts
      - name: Build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: agenoras-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*-mac.zip
          if-no-files-found: ignore
